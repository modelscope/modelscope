name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'The specific name of this build'
        required: true
        default: 'build'
      modelscope_branch:
        description: 'ModelScope branch to build from(release/x.xx), a patch build only uses it as the git source when --modelscope_install_source git is set'
        required: true
      image_type:
        description: 'The image type to build(base/old/stable/latest/amd/ascend/patch), use patch to refresh only modelscope/modelscope-hub on base_image'
        required: true
      modelscope_version:
        description: 'ModelScope version to use(x.xx.x), for a patch build this is the new version to install and to tag'
        required: true
      swift_branch:
        description: 'SWIFT branch to use(release/x.xx), required except for a patch build'
        required: false
      base_image:
        description: 'Patch build only: the already built image to patch(<repository>:<tag>)'
        required: false
      modelscope_hub_version:
        description: 'Patch build only: modelscope-hub version to install(x.x.x)'
        required: false
      ci_image:
        description: 'Set as the CI image'
        default: '0'
        required: false
      other_params:
        description: 'Other params in --xxx xxx'
        required: false
      python_version:
        description: 'Python version to use, default is 3.12.13'
        required: false
        default: '3.12.13'

run-name: Docker-${{ inputs.modelscope_branch }}-${{ inputs.image_type }}-${{ inputs.workflow_name }}-${{ inputs.python_version }}-by-@${{ github.actor }}

jobs:
  build:
    runs-on: [modelscope-self-hosted-us]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: ResetFileMode
      shell: bash
      run: |
        # reset filemode to allow action runner to delete files
        # generated by root in docker
        set -e
        source ~/.bashrc
        sudo chown -R $USER:$USER  $ACTION_RUNNER_DIR
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        # A patch build carries no repository content into the image, so it runs
        # the build tooling of the selected workflow branch instead of the
        # release branch.
        ref: ${{ inputs.image_type == 'patch' && github.ref || inputs.modelscope_branch }}

    - name: Build Docker Image
      env:
        IMAGE_TYPE: ${{ inputs.image_type }}
        PYTHON_VERSION: ${{ inputs.python_version }}
        MODELSCOPE_BRANCH: ${{ inputs.modelscope_branch }}
        MODELSCOPE_VERSION: ${{ inputs.modelscope_version }}
        SWIFT_BRANCH: ${{ inputs.swift_branch }}
        BASE_IMAGE: ${{ inputs.base_image }}
        MODELSCOPE_HUB_VERSION: ${{ inputs.modelscope_hub_version }}
        CI_IMAGE: ${{ inputs.ci_image }}
        OTHER_PARAMS: ${{ inputs.other_params }}
      run: |
        set -e
        source ~/.bashrc
        if [ "$IMAGE_TYPE" != "patch" ] && [ -z "$SWIFT_BRANCH" ]; then
          echo "swift_branch is required for the '$IMAGE_TYPE' image type"
          exit 1
        fi
        build_args=(
          --image_type "$IMAGE_TYPE"
          --python_version "$PYTHON_VERSION"
          --modelscope_branch "$MODELSCOPE_BRANCH"
          --modelscope_version "$MODELSCOPE_VERSION"
          --ci_image "$CI_IMAGE"
        )
        if [ -n "$SWIFT_BRANCH" ]; then
          build_args+=(--swift_branch "$SWIFT_BRANCH")
        fi
        if [ -n "$BASE_IMAGE" ]; then
          build_args+=(--base_image "$BASE_IMAGE")
        fi
        if [ -n "$MODELSCOPE_HUB_VERSION" ]; then
          build_args+=(--modelscope_hub_version "$MODELSCOPE_HUB_VERSION")
        fi
        # other_params stays unquoted on purpose: it carries '--xxx xxx' pairs,
        # e.g. --base_modelscope_version 1.40.0 --modelscope_install_source git
        python docker/build_image.py "${build_args[@]}" $OTHER_PARAMS
