name: Build Minor Docker Image

# Minor version build: reuse an already built major version image and refresh
# only the modelscope and modelscope-hub dependencies. Every other layer(cuda,
# python, torch, vllm, ms-swift, ...) is inherited from the base image as is.
# Use the "Build Docker Image" workflow for a full major version build.
on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'The specific name of this build'
        required: true
        default: 'minor-build'
      base_image:
        description: 'Tag of the already built major version image, e.g. ubuntu22.04-cuda13.0.3-py312-torch2.13.0-1.40.0 (a full repository:tag is also accepted)'
        required: true
      modelscope_version:
        description: 'ModelScope version to install and to tag(x.xx.x), e.g. 1.40.1'
        required: true
      modelscope_hub_version:
        description: 'modelscope-hub version to install(x.x.x), e.g. 0.4.3. Left to the dependency resolution of modelscope when empty'
        required: false
      modelscope_install_source:
        description: 'Install modelscope from the released PyPI version, or from the source of modelscope_branch'
        required: false
        type: choice
        default: 'pypi'
        options:
          - pypi
          - git
      modelscope_branch:
        description: 'ModelScope branch to install from(release/x.xx), only used when modelscope_install_source is git'
        required: false
      ci_image:
        description: 'Set as the CI image'
        default: '0'
        required: false
      other_params:
        description: 'Other params in --xxx xxx'
        required: false

run-name: Docker-minor-${{ inputs.modelscope_version }}-${{ inputs.workflow_name }}-by-@${{ github.actor }}

jobs:
  build:
    runs-on: [modelscope-self-hosted-us]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: ResetFileMode
      shell: bash
      run: |
        # reset filemode to allow action runner to delete files
        # generated by root in docker
        set -e
        source ~/.bashrc
        sudo chown -R $USER:$USER  $ACTION_RUNNER_DIR
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        # A minor build copies no repository content into the image, so the
        # build tooling comes from the branch this workflow runs from.
        ref: ${{ github.ref }}

    - name: Build Docker Image
      env:
        BASE_IMAGE: ${{ inputs.base_image }}
        MODELSCOPE_VERSION: ${{ inputs.modelscope_version }}
        MODELSCOPE_HUB_VERSION: ${{ inputs.modelscope_hub_version }}
        MODELSCOPE_INSTALL_SOURCE: ${{ inputs.modelscope_install_source }}
        MODELSCOPE_BRANCH: ${{ inputs.modelscope_branch }}
        CI_IMAGE: ${{ inputs.ci_image }}
        OTHER_PARAMS: ${{ inputs.other_params }}
      run: |
        set -e
        source ~/.bashrc
        if [ "$MODELSCOPE_INSTALL_SOURCE" = "git" ] && [ -z "$MODELSCOPE_BRANCH" ]; then
          echo "modelscope_branch is required when modelscope_install_source is git"
          exit 1
        fi
        build_args=(
          --image_type minor
          --base_image "$BASE_IMAGE"
          --modelscope_version "$MODELSCOPE_VERSION"
          --modelscope_install_source "$MODELSCOPE_INSTALL_SOURCE"
          --ci_image "$CI_IMAGE"
        )
        if [ -n "$MODELSCOPE_HUB_VERSION" ]; then
          build_args+=(--modelscope_hub_version "$MODELSCOPE_HUB_VERSION")
        fi
        if [ -n "$MODELSCOPE_BRANCH" ]; then
          build_args+=(--modelscope_branch "$MODELSCOPE_BRANCH")
        fi
        # other_params stays unquoted on purpose: it carries '--xxx xxx' pairs,
        # e.g. --base_modelscope_version 1.40.0
        python docker/build_image.py "${build_args[@]}" $OTHER_PARAMS
